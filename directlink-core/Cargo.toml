[package]
name = "directlink-core"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
rand = "0.8"
crc32fast = "1.4"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = "0.3"
